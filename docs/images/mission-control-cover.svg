<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Mission Control</title>
  <desc id="desc">Dark operational dashboard with telemetry cards and a glowing cyan accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#101b2d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d9ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="160" r="260" fill="#39d9ff" opacity=".12" filter="url(#shadow)"/>
  <circle cx="260" cy="760" r="300" fill="#7c6cff" opacity=".10" filter="url(#shadow)"/>
  <rect x="90" y="90" width="1420" height="720" rx="28" fill="#0b1220" stroke="#263957" stroke-width="2"/>
  <rect x="90" y="90" width="1420" height="88" rx="28" fill="#111d31"/>
  <circle cx="132" cy="134" r="10" fill="#ff647c"/><circle cx="164" cy="134" r="10" fill="#ffc857"/><circle cx="196" cy="134" r="10" fill="#35d07f"/>
  <text x="250" y="145" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">HERMES MISSION CONTROL</text>
  <text x="250" y="177" fill="#7f9bb8" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="3">LOCAL-FIRST OPERATIONS DASHBOARD</text>
  <rect x="130" y="220" width="300" height="520" rx="18" fill="#101b2d" stroke="#20324d"/>
  <text x="170" y="275" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">SYSTEM STATUS</text>
  <text x="170" y="335" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">ONLINE</text>
  <circle cx="179" cy="380" r="8" fill="#35d07f"/><text x="202" y="388" fill="#a9bfd3" font-family="Inter,Arial,sans-serif" font-size="18">Telemetry live</text>
  <rect x="170" y="450" width="220" height="12" rx="6" fill="#1b2b43"/><rect x="170" y="450" width="154" height="12" rx="6" fill="url(#glow)"/>
  <text x="170" y="505" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14">CPU</text><text x="340" y="505" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="end">70%</text>
  <text x="170" y="550" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14">MEMORY</text><text x="340" y="550" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="end">42%</text>
  <text x="170" y="595" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14">SESSIONS</text><text x="340" y="595" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="end">12</text>
  <rect x="470" y="220" width="470" height="245" rx="18" fill="#101b2d" stroke="#20324d"/><rect x="970" y="220" width="500" height="245" rx="18" fill="#101b2d" stroke="#20324d"/>
  <rect x="470" y="495" width="690" height="245" rx="18" fill="#101b2d" stroke="#20324d"/><rect x="1190" y="495" width="280" height="245" rx="18" fill="#101b2d" stroke="#20324d"/>
  <text x="510" y="275" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">PROVIDER USAGE</text>
  <text x="510" y="345" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">3</text><text x="560" y="345" fill="#a9bfd3" font-family="Inter,Arial,sans-serif" font-size="18">providers connected</text>
  <path d="M510 400h350" stroke="url(#glow)" stroke-width="6" stroke-linecap="round"/>
  <text x="1010" y="275" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">ACTIVE AGENTS</text><text x="1010" y="350" fill="#eaf4ff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="700">8</text>
  <text x="510" y="550" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">ACTIVITY FEED</text><circle cx="520" cy="610" r="7" fill="#39d9ff"/><circle cx="520" cy="665" r="7" fill="#7c6cff"/><circle cx="520" cy="720" r="7" fill="#35d07f"/>
  <path d="M550 610h500M550 665h430M550 720h380" stroke="#355070" stroke-width="8" stroke-linecap="round"/>
  <text x="1230" y="550" fill="#7893b0" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">QUICK ACTIONS</text><rect x="1230" y="600" width="180" height="36" rx="8" fill="url(#glow)"/><text x="1320" y="624" fill="#07111e" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">OPEN HERMES</text><rect x="1230" y="655" width="180" height="36" rx="8" fill="#1a2a43"/><text x="1320" y="679" fill="#d9eaff" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">VIEW LOGS</text>
</svg>
