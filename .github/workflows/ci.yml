name: CI

on:
  push:
    branches: [main, develop, feat/linux-port, fix/linux-configurable-ports]
    tags: ['v*']
  pull_request:
    branches: [main, develop, feat/linux-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    name: Documented paths check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-documented-paths.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:frontend
      - run: pnpm test:vite-config
      - run: pnpm test:rooms
      - run: pnpm test:chat-profile
      - run: pnpm test:mobile-route-layout
      - run: pnpm test:navigation-palette
      - run: pnpm test:cron-model-selection
      - run: pnpm test:cron-schedule-input
      - run: pnpm test:system-health-ui

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # The invite-rooms server tests import the Hermes core `gateway` package; check out the
      # public core at a pinned commit (bump deliberately) and expose it only to that step.
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 290080e19e8e143d35f67427e89aed662161faf8
          path: .hermes-core
      - run: python -m pip install -r server/requirements.txt -r server/requirements-rooms.txt 'ruamel.yaml>=0.18,<0.19' 'pytest>=8,<9'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s server/tests -p 'test_*.py'
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/server/tests:${{ github.workspace }}/.hermes-core
      - run: python -m pytest server/tests/test_chat_timestamps.py server/tests/test_material_control_w2c.py server/tests/test_material_deadline_protocol_w2c.py
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/server/tests:${{ github.workspace }}/.hermes-core

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [paths, frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify SemVer tag matches package version
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const tag = process.env.TAG;
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

          const match = tag.startsWith('v') ? semver.exec(tag.slice(1)) : null;
          if (!match) {
            throw new Error(`Tag ${tag} is not v<SemVer>`);
          }
          if (tag.slice(1) !== version) {
            throw new Error(`Tag ${tag} does not match package.json version ${version}`);
          }
          console.log(`is_prerelease=${Boolean(match[4])}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `is_prerelease=${Boolean(match[4])}\n`);
          NODE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.semver.outputs.is_prerelease }}
        run: |
          args=()
          if [ "$IS_PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "Mission Control $GITHUB_REF_NAME" "${args[@]}"
