name: CI

on:
  push:
    branches: [main, develop, feat/linux-port, fix/linux-configurable-ports]
  pull_request:
    branches: [main, develop, feat/linux-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths:
    name: Documented paths check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-documented-paths.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:frontend
      - run: pnpm test:vite-config
      - run: pnpm test:rooms
      - run: pnpm test:chat-profile
      - run: pnpm test:mobile-route-layout
      - run: pnpm test:system-health-ui

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s server/tests -p 'test_*.py'
