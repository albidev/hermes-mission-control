name: CI

on:
  push:
    branches: [main, develop, feat/linux-port]
  pull_request:
    branches: [main, develop, feat/linux-port]

permissions:
  contents: read

jobs:
  paths:
    name: Documented paths check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-documented-paths.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:vite-config

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
