<!doctype html>
<html lang="en" style="background:#0f1117;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes MC" />
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const theme = localStorage.getItem('mission-control-theme') || 'system';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = theme === 'dark' || theme === 'light' ? theme : (prefersDark ? 'dark' : 'light');
          const bg = resolved === 'dark' ? '#0f1117' : '#ffffff';

          root.setAttribute('data-theme', resolved);
          root.style.backgroundColor = bg;
          root.style.colorScheme = resolved;
          document.body?.style.setProperty('background-color', bg);
          document.getElementById('root')?.style.setProperty('background-color', bg);

          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', resolved === 'dark' ? '#0f1117' : '#ffffff');
          }
        } catch {}
      })();
    </script>
    <title>Hermes Mission Control</title>
    <meta
      name="description"
      content="Mobile-first Mission Control for Hermes: status, sessions, alerts, and quick actions in one view."
    />
    <style>
      :root { color-scheme: dark light; }
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #0f1117;
      }
      body { background: inherit; }
      #root { background: inherit; }
      @media (prefers-color-scheme: light) {
        html, body, #root { background: #ffffff; }
      }
      html[data-theme='dark'], html[data-theme='dark'] body, html[data-theme='dark'] #root { background: #0f1117; }
      html[data-theme='light'], html[data-theme='light'] body, html[data-theme='light'] #root { background: #ffffff; }
      #boot-splash {
        position: fixed;
        inset: 0 0 auto;
        height: 3px;
        z-index: 9999;
        background: linear-gradient(90deg, #8b5cf6, #38bdf8, #8b5cf6);
        background-size: 200% 100%;
        animation: boot-progress 1.2s linear infinite;
      }
      #boot-splash .boot-spinner, #boot-splash .boot-word { display: none; }
      @keyframes boot-progress { to { background-position: -200% 0; } }
    </style>
  </head>
  <body style="background:#0f1117;">
    <div id="root" style="background:#0f1117;">
      <div id="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-word">Hermes Mission Control</div>
      </div>
    </div>
    <script>
      const bootTheme = document.documentElement.dataset.theme === 'light' ? '#ffffff' : '#0f1117';
      document.body.style.backgroundColor = bootTheme;
      document.getElementById('root').style.backgroundColor = bootTheme;
      document.getElementById('boot-splash').style.backgroundColor = bootTheme;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
